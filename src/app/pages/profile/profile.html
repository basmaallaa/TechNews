<div class="min-h-screen bg-[#0A0F1E] flex items-center justify-center px-6">
  <div class="w-full max-w-md bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl p-8 shadow-xl">

    <!-- Header: صورة + اسم وإيميل جنب بعض -->
    <div class="flex items-center gap-5 mb-6">

      <div class="relative shrink-0">
        <div class="w-[72px] h-[72px] rounded-full overflow-hidden border-2 border-cyan-400 shadow-lg">
          <img *ngIf="profileImage; else initials" [src]="profileImage" class="w-full h-full object-cover" />
          <ng-template #initials>
            <div class="w-full h-full flex items-center justify-center bg-gradient-to-r from-indigo-500 to-cyan-400 text-white text-lg font-bold">
              {{ user?.firstName?.charAt(0) }}{{ user?.lastName?.charAt(0) }}
            </div>
          </ng-template>
        </div>
        <label class="absolute bottom-0 right-0 w-[22px] h-[22px] flex items-center justify-center bg-cyan-400 text-black text-xs font-bold rounded-full cursor-pointer hover:scale-105 transition">
          +
          <input type="file" hidden (change)="onImageChange($event)" />
        </label>
      </div>

      <div class="min-w-0 flex-1">
        <h2 class="text-white text-base font-semibold truncate">
          {{ user?.firstName }} {{ user?.lastName }}
        </h2>
        <p class="text-slate-400 text-sm mt-0.5 truncate">{{ user?.email }}</p>
      </div>
    </div>

    <!-- تفاصيل -->
    <div class="border-t border-white/10 pt-5 flex flex-col gap-3">

      <div class="flex items-center gap-3">
        <svg class="w-4 h-4 text-cyan-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M4 4h16v13H4z M8 21h8 M12 17v4"/>
        </svg>
        <span class="text-slate-400 text-sm w-16">Email</span>
        <span class="text-slate-200 text-sm truncate">{{ user?.email }}</span>
      </div>

      <div class="flex items-center gap-3">
        <svg class="w-4 h-4 text-cyan-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M22 16.9a19 19 0 0 1-5.6-.9l-2.4 2.4a19 19 0 0 1-8.4-8.4l2.4-2.4A19 19 0 0 1 7.1 2H2a20 20 0 0 0 20 20v-5.1z"/>
        </svg>
        <span class="text-slate-400 text-sm w-16">Phone Number</span>
        <span class="text-slate-200 text-sm" dir="ltr">{{ user?.phoneNumber }}</span>
      </div>

    </div>
  </div>
</div>
