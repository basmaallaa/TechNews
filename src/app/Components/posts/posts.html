<div class="lg:col-span-2 space-y-6">
  <h3 class="text-lg font-bold">{{ sectionTitle }}</h3>
  <div class="grid sm:grid-cols-2 gap-6">
    <div appPostHover (click)="openPost(post.id)" *ngFor="let post of postService.posts()" class="cursor-pointer bg-slate-800 rounded-2xl overflow-hidden border border-slate-700
                  
                  flex flex-col">
      <div class="h-40 bg-slate-900 flex items-center justify-center overflow-hidden">
          <img *ngIf="post.image" [src]="post.image" [alt]="post.title"
            class="h-full w-full object-cover" loading="lazy" />
          <span *ngIf="!post.image" class="text-5xl opacity-20">📰</span>
      </div>
      <div class="p-5 flex flex-col flex-1">
        <div class="flex items-center justify-between mb-3">
            <span [appCategoryColor]="post.category" class="text-xs font-semibold px-3 py-1 rounded-full border inline-block">
              {{ post.category }}
            </span>
            
          </div>
          <h3 class="text-slate-100 font-semibold text-sm leading-snug mb-2 line-clamp-2">
            {{ post.title }}
          </h3>
          <p class="text-slate-400 text-xs leading-relaxed flex-1">
            {{ post.content | customContent:10 }}
          </p>
          <div  class="mt-4 pt-4 border-t border-slate-700 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <img *ngIf="post.user?.avatar; else initials"[src]="post.user.avatar" class="w-8 h-8 rounded-lg border border-[rgba(108,99,255,0.3)]" alt="">
                <ng-template #initials>
                  <div class="w-8 h-8 rounded-lg bg-cyan-500 flex items-center justify-center text-white text-xs font-bold">
                    {{ post.user?.firstName?.charAt(0) }}{{ post.user?.lastName?.charAt(0) }}
                  </div>
                </ng-template>
                <div>
                  <div class="text-white text-xs font-semibold">{{ post.user?.firstName }} {{ post.user?.lastName }}</div>
                  <div class="text-slate-500 text-xs">{{ post.publishedAt | date:'MMM d, y' }}</div>
                </div>
              </div>
          <!-- <button (click)="toggleExpand(post.id)" class="cursor-pointer text-sky-400 text-xs font-medium hover:text-sky-300
                     transition-colors duration-200">
              {{ isExpanded(post.id) ? '▲ Show Less' : '▼ Read More' }}
            </button> -->
          </div>
      </div>

    </div>

  </div>

</div>
